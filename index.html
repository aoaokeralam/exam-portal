      App.verifyMemberPEN = function () {
        const penInput = document.getElementById('regPEN');
        const errEl = document.getElementById('regStep1Error');
        const pen = (penInput.value || '').trim();
        errEl.style.display = 'none';

        if (!pen) {
          errEl.textContent = 'Please enter your Permanent Employee Number (PEN).';
          errEl.style.display = 'block';
          return;
        }

        penInput.disabled = true;
        callApi('checkPEN', { pen: pen })
          .then(function (res) {
            penInput.disabled = false;
            if (!res.ok) {
              errEl.textContent = res.error || 'PEN not found in AOAOK Member Directory.';
              errEl.style.display = 'block';
              return;
            }

            App._regMember = res.member;
            App._regExams = res.exams || [];

            document.getElementById('regStep1').style.display = 'none';
            document.getElementById('regStep2').style.display = 'block';

            document.getElementById('regMemberName').textContent = res.member.name;
            document.getElementById('regMemberMeta').textContent = res.member.designation + ' | PEN: ' + res.member.pen;

            const sel = document.getElementById('regExamSelect');
            sel.innerHTML = '';
            if (!res.exams || !res.exams.length) {
              sel.innerHTML = '<option value="">No examinations open for registration currently</option>';
              document.getElementById('btnSubmitReg').disabled = true;
            } else {
              document.getElementById('btnSubmitReg').disabled = false;
              res.exams.forEach(function (x) {
                const opt = document.createElement('option');
                opt.value = x.examId;
                opt.textContent = x.code + ' - ' + x.title + ' (' + x.durationMin + ' Mins)';
                sel.appendChild(opt);
              });
            }
          })
          .catch(function (err) {
            penInput.disabled = false;
            errEl.textContent = err.message || 'Error communicating with directory service.';
            errEl.style.display = 'block';
          });
      };

      App.submitCandidateRegistration = function () {
        const emailInput = document.getElementById('regEmail');
        const examSel = document.getElementById('regExamSelect');
        const passInput = document.getElementById('regCustomPass');
        const errEl = document.getElementById('regStep2Error');
        const btn = document.getElementById('btnSubmitReg');

        const email = (emailInput.value || '').trim().toLowerCase();
        const examId = examSel.value;
        const customPass = (passInput.value || '').trim();

        errEl.style.display = 'none';

        if (!email || !email.includes('@') || !email.includes('.')) {
          errEl.textContent = 'Please enter a valid email address.';
          errEl.style.display = 'block';
          return;
        }
        if (!examId) {
          errEl.textContent = 'Please select an examination.';
          errEl.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Registering candidate...';

        callApi('registerCandidate', {
          pen: App._regMember.pen,
          email: email,
          examId: examId,
          customPassword: customPass
        })
          .then(function (res) {
            btn.disabled = false;
            btn.textContent = 'Complete Registration';

            if (!res.ok) {
              errEl.textContent = res.error || 'Registration failed.';
              errEl.style.display = 'block';
              return;
            }

            App._lastRegistered = res.candidate;
            document.getElementById('regStep2').style.display = 'none';
            document.getElementById('regStep3').style.display = 'block';

            document.getElementById('confExamCode').textContent = res.candidate.examCode;
            document.getElementById('confUserId').textContent = res.candidate.userId;
            document.getElementById('confPassword').textContent = res.candidate.plainPass || '(Configured Password)';
            document.getElementById('confName').textContent = res.candidate.name;
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = 'Complete Registration';
            errEl.textContent = err.message || 'Registration failed.';
            errEl.style.display = 'block';
          });
      };

          '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
          '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +

            '<th>Roll No</th>' +
            '<th>Candidate Name</th>' +
            '<th>PEN</th>' +
            '<th>Designation</th>' +
            '<th>User ID</th>' +
            '<th>Email Address</th>' +
            '<th>Status</th>' +
            '<th>Password / PIN</th>' +
            '<th>Credentials Sent</th>' +
            '<th>Registration Date</th>' +
          '</tr>';

        cands.forEach(function (c) {
          tableHtml +=
            '<tr>' +
              '<td style="mso-number-format:\'\\@\'; font-weight:bold;">' + escapeHtml(c.RollNo || '') + '</td>' +
              '<td>' + escapeHtml(c.Name || '') + '</td>' +
              '<td style="mso-number-format:\'\\@\';">' + escapeHtml(c.PEN || '') + '</td>' +

            '</tr>';
        });

        tableHtml += '</table></body></html>';

        const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });

      App.processMemberBulkUpload = function () {
        const text = (document.getElementById('memberPasteArea').value || '').trim();
        const replace = document.getElementById('chkReplaceMembers').checked;
        const errEl = document.getElementById('memUploadError');

        if (!text) {
          errEl.textContent = 'Please paste member data.';
          errEl.style.display = 'block';
          return;
        }

        const lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
        const rows = [];
        lines.forEach(function (line) {
          const parts = line.includes('\t') ? line.split('\t') : line.split(',');
          if (parts.length >= 2) {
            rows.push({
              pen: parts[0].trim(),
              name: parts[1].trim(),
              designation: parts[2] ? parts[2].trim() : 'Agricultural Officer'
            });
          }
        });

        if (!rows.length) {
          errEl.textContent = 'Could not parse any valid rows. Ensure format is PEN, Name, Designation.';
          errEl.style.display = 'block';
          return;
        }

        callApi('uploadMembers', { rows: rows, replace: replace })
          .then(function (res) {
            if (res.ok) {
              App.closeModal();
              loadAdminTabContent();
            } else {
              errEl.innerHTML = 'Upload errors:<br>' + (res.errors || []).join('<br>');
              errEl.style.display = 'block';
            }
          })
          .catch(function (err) {
            errEl.textContent = err.message || 'Upload failed.';
            errEl.style.display = 'block';
          });
      };

          '<div style="display:flex; justify-content:flex-end; gap:10px;">' +
            '<button class="sec" onclick="App.closeModal()">Cancel</button>' +
            '<button class="pri" style="background:#0284c7; border-color:#0284c7; font-weight:700;" onclick="App.submitResetCandidatePassword(\'' + userId + '\')">Save &amp; Update Password</button>' +
          '</div>';

        openModal(html);
      };

      App.submitResetCandidatePassword = function (userId) {
        const examId = App.adminState.selectedExamId;
        const newPass = document.getElementById('resetCandNewPassInput').value.trim();
        const sendEmailChk = document.getElementById('resetCandSendEmailChk');
        const unlockChk = document.getElementById('resetCandUnlockSessionChk');

        if (!newPass) return alert('Please enter a new password or PIN.');

        const payload = {
          examId: examId,
          userId: userId,
          newPassword: newPass,
          sendEmail: sendEmailChk ? sendEmailChk.checked : false,
          unlockSession: unlockChk ? unlockChk.checked : true
        };

        callApi('resetCandidatePassword', payload)
          .then(function (res) {
            alert('Password for candidate ' + res.name + ' (' + res.userId + ') has been updated to: ' + res.newPassword + (res.emailSent ? '\nAn updated email has also been sent to the candidate.' : ''));
            App.closeModal();
            loadAdminTabContent();
          })
          .catch(function (err) {
            alert('Failed to reset password: ' + err.message);
          });
      };

      /* Change Admin Password Modal */
      App.openChangeAdminPasswordModal = function () {
        const html =
          '<div class="modal-head">' +
            '<h2 style="margin:0; font-size:18px; color:var(--brand-900);">Change Administrator Password</h2>' +
            '<button class="modal-close-btn" onclick="App.closeModal()">&times;</button>' +
          '</div>' +
          '<p style="color:var(--slate-500); font-size:13px; margin:4px 0 16px 0;">' +
            'Update the master administrator login password for the AOAOK examination portal.' +
          '</p>' +
          '<div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">' +
            '<div>' +
              '<label style="display:block; font-weight:700; margin-bottom:4px; font-size:13px;">Current Admin Password</label>' +
              '<input type="password" id="adminOldPassInput" placeholder="Enter current password" style="width:100%;">' +
            '</div>' +
            '<div>' +
              '<label style="display:block; font-weight:700; margin-bottom:4px; font-size:13px;">New Admin Password</label>' +
              '<input type="password" id="adminNewPassInput" placeholder="At least 6 characters" style="width:100%;">' +
            '</div>' +
            '<div>' +
              '<label style="display:block; font-weight:700; margin-bottom:4px; font-size:13px;">Confirm New Password</label>' +
              '<input type="password" id="adminConfirmPassInput" placeholder="Re-type new password" style="width:100%;">' +
            '</div>' +
          '</div>' +
          '<div style="display:flex; justify-content:flex-end; gap:10px;">' +
            '<button class="sec" onclick="App.closeModal()">Cancel</button>' +
            '<button class="pri" style="font-weight:700;" onclick="App.submitChangeAdminPassword()">Update Admin Password</button>' +
          '</div>';

        openModal(html);
      };

      App.submitChangeAdminPassword = function () {
        const oldPass = document.getElementById('adminOldPassInput').value.trim();
        const newPass = document.getElementById('adminNewPassInput').value.trim();
        const confPass = document.getElementById('adminConfirmPassInput').value.trim();

        if (!oldPass) return alert('Please enter your current admin password.');
        if (!newPass || newPass.length < 6) return alert('New password must be at least 6 characters.');
        if (newPass !== confPass) return alert('New password and Confirm password do not match.');

        callApi('changeAdminPassword', { oldPassword: oldPass, newPassword: newPass })
          .then(function () {
            alert('Administrator password changed successfully! Please keep your new password safe.');
            App.closeModal();
          })
          .catch(function (err) {
            alert('Failed: ' + err.message);
          });
      };

      /* Copy Text to Clipboard & Toast */
      App.copyText = function (text, successMsg) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            App.showToast(successMsg || 'Copied to clipboard!');
          }).catch(function () {
            fallbackCopy(text, successMsg);
          });
        } else {
          fallbackCopy(text, successMsg);
        }
        function fallbackCopy(t, msg) {
          const ta = document.createElement('textarea');
          ta.value = t;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            App.showToast(msg || 'Copied to clipboard!');
          } catch (e) {
            alert('Copied: ' + t);
          }
          document.body.removeChild(ta);
        }
      };

      App.showToast = function (msg) {
        let toast = document.getElementById('appToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'appToast';
          toast.style.position = 'fixed';
          toast.style.bottom = '24px';
          toast.style.right = '24px';
          toast.style.background = '#0f172a';
          toast.style.color = '#ffffff';
          toast.style.padding = '10px 18px';
          toast.style.borderRadius = '8px';
          toast.style.fontSize = '13.5px';
          toast.style.fontWeight = '600';
          toast.style.boxShadow = '0 4px 14px rgba(0,0,0,0.2)';
          toast.style.zIndex = '99999';
          toast.style.transition = 'opacity 0.25s ease';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.display = 'block';
        if (window._toastTimer) clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(function () {
          toast.style.opacity = '0';
          setTimeout(function () { toast.style.display = 'none'; }, 300);
        }, 2500);
      };

/* Universal Sign Out */
      App.logout = function () {
        if (App.role === 'cand') {
          try { callApi('candLogout', {}); } catch (e) {}
          cleanupSession();
          try {
            if (window.top && window.top !== window) {
              window.top.location.href = 'https://www.aoaok.co.in';
            } else {
              window.location.href = 'https://www.aoaok.co.in';
            }
          } catch (e) {
            window.location.href = 'https://www.aoaok.co.in';
          }
        } else if (App.role === 'admin') {
          callApi('adminLogout', {}).finally(function () {
            cleanupSession();
          });
        } else {
          cleanupSession();
        }
      };

      function cleanupSession() {
        if (App.heartbeatTimer) clearInterval(App.heartbeatTimer);
        if (window._examClockTimer) clearInterval(window._examClockTimer);
        if (window._monitorPoll) clearInterval(window._monitorPoll);
        if (window._waitTimer) clearInterval(window._waitTimer);

        App.token = '';
        App.role = '';
        App.userData = null;
        App.currentExam = null;
        renderLogin('cand');
      }

            // Multi-layer bulletproof initialization
      function initApp() {
        const staticLogo = document.getElementById('staticLoginLogo');
        if (staticLogo && !staticLogo.src) staticLogo.src = AOAOK_LOGO;
        if (window._appInitialized) return;
        window._appInitialized = true;
        renderLogin('cand');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
        window.addEventListener('load', initApp);
      } else {
        initApp();
      }
      setTimeout(initApp, 100);

    })();
  </script>
</body>
</html>
